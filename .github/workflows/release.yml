name: Release

# GitHub's automatic "Source code" archives unpack to CleanShelf-<version>/, which does not
# replace an installed theme cleanly. This attaches CleanShelf.zip, which always unpacks to
# CleanShelf/, to every release.
on:
  release:
    types: [published]
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CleanShelf.zip
        run: |
          mkdir -p /tmp/pkg
          git archive --format=tar --prefix=CleanShelf/ HEAD | tar -x -C /tmp/pkg
          rm -rf /tmp/pkg/CleanShelf/.github /tmp/pkg/CleanShelf/tools /tmp/pkg/CleanShelf/.gitignore
          (cd /tmp/pkg && zip -qr "$GITHUB_WORKSPACE/CleanShelf.zip" CleanShelf)
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "CleanShelf ${GITHUB_REF_NAME#v}" --notes ""
          gh release upload "$GITHUB_REF_NAME" CleanShelf.zip --clobber
