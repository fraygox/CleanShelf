name: Release

# GitHub's automatic "Source code" archives unpack to CleanShelf-<version>/, which does not
# replace an installed theme cleanly. Pushing a v* tag creates the release and attaches
# CleanShelf.zip, which always unpacks to CleanShelf/. To (re)build one for an existing tag,
# run this workflow by hand and give it the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.0.3)
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build CleanShelf.zip
        run: |
          mkdir -p /tmp/pkg
          git archive --format=tar --prefix=CleanShelf/ HEAD | tar -x -C /tmp/pkg
          rm -rf /tmp/pkg/CleanShelf/.github /tmp/pkg/CleanShelf/tools /tmp/pkg/CleanShelf/.gitignore
          (cd /tmp/pkg && zip -qr "$GITHUB_WORKSPACE/CleanShelf.zip" CleanShelf)
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "CleanShelf ${TAG#v}" --generate-notes
          gh release upload "$TAG" CleanShelf.zip --clobber
